<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkmotion.art</title>
<meta name="description" content="The premier home of innovative methods for 21st century storytellers">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e0e0e;
    --ink-mid: #3a3a3a;
    --ink-muted: #6b6b6b;
    --paper: #f5f2ee;
    --accent: #d94f2b;
    --accent-dark: #b83e1f;
    --white: #ffffff;
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { color-scheme: light; }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
  }

  main {
    width: 100%;
    max-width: 56rem;
    padding: 3rem 1.5rem;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.8rem, 11.5vw, 7.5rem);
    line-height: 0.95;
    letter-spacing: -0.04em;
  }

  h1 .art { color: var(--accent); }

  .mark { display: inline-block; max-width: 100%; }

  .stroke {
    display: block;
    width: 100%;
    height: auto;
    margin-top: 0.6rem;
    overflow: visible;
  }

  .stroke path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 1.3s 0.3s cubic-bezier(0.6, 0.1, 0.2, 1) forwards;
  }

  .tagline {
    margin-top: 1.75rem;
    max-width: 34rem;
    font-size: clamp(1.15rem, 2.6vw, 1.6rem);
    font-weight: 300;
    line-height: 1.45;
    color: var(--ink-mid);
    animation: fadeUp 0.7s 0.5s ease both;
  }

  form {
    margin-top: 3rem;
    max-width: 34rem;
    animation: fadeUp 0.7s 0.7s ease both;
  }

  label {
    display: block;
    margin-bottom: 0.6rem;
    font-size: 1rem;
    font-weight: 500;
  }

  .row { display: flex; gap: 0.5rem; }

  input[type="email"] {
    flex: 1;
    min-width: 0;
    padding: 0.85rem 1rem;
    border: 1.5px solid var(--ink);
    border-radius: 0;
    background: var(--white);
    color: var(--ink);
    font: inherit;
    font-weight: 300;
  }

  input[type="email"]::placeholder { color: var(--ink-muted); }

  button {
    padding: 0.85rem 1.5rem;
    border: 1.5px solid var(--ink);
    border-radius: 0;
    background: var(--ink);
    color: var(--paper);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }

  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .status {
    margin-top: 0.75rem;
    min-height: 1.5em;
    font-size: 0.95rem;
  }

  .status.error { color: #a32d2d; }

  .thanks {
    font-size: 1.15rem;
    font-weight: 500;
  }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stroke path { animation: none; stroke-dashoffset: 0; }
    .tagline, form { animation: none; }
  }

  @media (max-width: 480px) {
    .row { flex-direction: column; }
  }
</style>
</head>
<body>

<main>
  <div class="mark">
    <h1>Inkmotion<span class="art">.art</span></h1>
    <svg class="stroke" viewBox="0 0 600 24" aria-hidden="true">
      <path pathLength="1" d="M4 14 C 80 4, 140 22, 220 12 S 380 6, 460 14 S 560 18, 596 8" />
    </svg>
  </div>

  <p class="tagline">The premier home of innovative methods for 21st century storytellers</p>

  <form id="signup" action="https://formspree.io/f/xvzynkqe" method="POST">
    <label for="email">Sign up to learn more about Inkmotion.Art</label>
    <div class="row">
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      <button type="submit" id="submit">Sign up</button>
    </div>
    <input type="hidden" name="source" value="inkmotion-landing">
    <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
  (function () {
    var form = document.getElementById('signup');
    var button = document.getElementById('submit');
    var status = document.getElementById('status');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      status.textContent = '';
      status.className = 'status';
      button.disabled = true;
      button.textContent = 'Sending…';

      fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      }).then(function (res) {
        if (!res.ok) { throw new Error('bad status ' + res.status); }
        form.innerHTML = '<p class="thanks" role="status">Thanks. You’re on the list.</p>';
      }).catch(function () {
        button.disabled = false;
        button.textContent = 'Sign up';
        status.className = 'status error';
        status.textContent = 'Something went wrong. Please try again in a moment.';
      });
    });
  })();
</script>

</body>
</html>
